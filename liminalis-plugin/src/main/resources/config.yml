# Liminalis configuration.
#
# Every tunable number in the plugin lives in this file. Edit and run
# /liminalis reload - no restart needed.
#
# If anything here is invalid, the new values are REFUSED and the previous ones stay in
# force, with the problems printed to the console. On startup, an invalid config stops the
# plugin from enabling at all, rather than silently running on numbers nobody chose.

lives:
  # How many lives a player starts with. The last one being spent sends them to Limbo.
  # Must be between 1 and 100.
  starting: 3

  # Whether being killed by another player costs a life.
  #
  # Also toggleable in game with /liminalis lives pvpcounts on|off, which writes the
  # change back here so it survives a restart.
  #
  # Note this is narrow on purpose: switching it off stops friends costing each other
  # lives, and does nothing else. Lava, creepers and long falls still cost a life.
  pvp-deaths-count: true

limbo:
  # The world Limbo lives in. Created on first startup as an endless pale garden with
  # no caves, no structures and nothing alive in it. Letters, digits, _ and - only.
  world-name: liminalis_limbo

  # How far Limbo extends from its centre, in blocks. On foot this is effectively
  # endless; the limit exists so one player walking in a straight line for a week
  # cannot generate chunks forever.
  border-radius: 5000

  # How many lives someone comes back with when they are revived.
  revival-lives: 2

  # The chance that something said in Limbo is faintly heard by the living, worn down
  # to the shape of a sentence. 0.0 silences the dead entirely; 1.0 relays everything.
  whisper-chance: 0.15

  # How long a ghost visit to the living world lasts, and how long after it ends before
  # another can begin. Given in seconds; the cooldown runs from the END of the visit.
  ghost-visit-seconds: 300
  ghost-cooldown-seconds: 900

storage:
  # Copy the players/ directory into backups/ every time the server starts.
  # Cheap insurance against a bad migration or a mistaken admin command.
  backup-on-start: true

  # How many backups to keep. The oldest are deleted beyond this.
  # Must be at least 1 - to turn backups off, use backup-on-start above.
  keep-backups: 10

traits:
  # Everyone gets one trait on their first join. This is the chance of a second.
  second-trait-chance: 0.25

  # The chance that any individual trait slot reaches into the Singularity pool
  # instead of the ordinary one. Applied per slot, so a player with two traits has
  # roughly twice this chance of seeing one at all.
  singularity-chance: 0.03

  # Every number the traits themselves use. Change one and run /liminalis reload -
  # traits read these at the moment they apply, so a rebalance takes effect at once
  # without a restart. Keys nobody reads are ignored, so leftovers are harmless.
  tuning:
    short.scale: -0.10
    swift_hands.break-speed: 0.30
    ironbound.armor: 2.0
    deep_lungs.oxygen: 4.0
    resilience.max-armor: 8.0
    coward.max-bonus-damage: 3.0
    coward.max-penalty-damage: 2.0
    deathsight.range: 48.0
    stillness.heal-per-half-second: 0.35
    mark_of_return.sense-range: 24.0

    # The rest of the ordinary roster.
    tall.scale: 0.12
    fleet.speed: 0.08
    sure_footed.safe-fall: 6.0
    heavy.knockback-resistance: 0.35
    warm_blooded.burning-time: 0.50
    waterborne.movement: 0.5
    waterborne.mining: 0.4
    dawnbound.max-attack: 2.5
    duskbound.max-attack: 2.5

    # Singularity tier.
    liminal.range: 64.0
    unseen.range: 24.0

    # Blessings - a gift, with nothing asked in return.
    #
    # None of these are stats. The traits above already own that space and own eighteen slots
    # of it, so a blessing that was also a number was just a rarer version of something you
    # could have rolled anyway. Every one of these changes what a player CAN DO.
    #
    # emberborn: fire, lava, magma and campfires cannot hurt you, and you never stay alight.
    emberborn.show-embers: 1.0
    # thrice_born: a fourth life. Granted once, when the blessing lands - not on every login.
    thrice_born.extra-lives: 1.0
    # unbroken: mortal wounds never take. A maiming blow leaves an ordinary wound instead.
    #           No tuning - it is on or it is not.
    # soulbound: you keep your inventory and your levels when you die. Also no tuning.
    # sunfed: under open sky in daylight your hunger does not drop.
    sunfed.minimum-saturation: 5.0
    # hearthbound: players near you slowly mend. Does nothing at all for you.
    hearthbound.range: 10.0
    hearthbound.effect-ticks: 60.0

    # Curses - a bigger gift than any blessing, and a real cost for it.
    #
    # hollow: three extra hearts, and no armour above Protection II will stay on you.
    #         Kept from the brief verbatim; its identity was always the armour, not the hearts.
    hollow.health: 6.0
    hollow.max-protection-level: 2
    # untethered: cross into Limbo whenever you like. No bed will ever catch you again.
    untethered.crossing-cooldown-seconds: 900
    # sunless: night vision always, and nothing hunts you in the dark. Daylight sets you alight.
    sunless.burn-ticks: 60
    sunless.unseen-range: 16.0
    sunless.dark-below-light: 8.0
    # bloodhungry: killing heals you. Nothing else does - not food, not regeneration, nothing.
    bloodhungry.heal-per-kill: 4.0
    # gluttonous: food mends you four times over, and your hunger drains four times as fast.
    gluttonous.food-healing-multiplier: 4.0
    # Added on top of whatever they are already burning through moving and fighting. Vanilla
    # spends 4.0 exhaustion per haunch, and this loop runs twice a second, so 0.12 costs them
    # a haunch roughly every fifteen seconds of standing perfectly still.
    gluttonous.exhaustion-per-tick: 0.12
    # marked: every Singularity creature you kill gives up its book. They come looking for you.
    marked.spawn-weight: 4.0

    # Injuries. duration-seconds is how long each takes to fade on its own.
    # Bleeding deals REAL damage every two seconds - it flashes, it makes a sound, and it
    # bypasses armour, because the wound is already inside the armour. It will never be the
    # thing that kills you: the damage stops dead at stops-at-health.
    bleeding.duration-seconds: 180
    bleeding.damage-per-tick: 1.0
    bleeding.stops-at-health: 4.0
    sprained_ankle.duration-seconds: 300
    sprained_ankle.speed-penalty: 0.20
    burns.duration-seconds: 300
    burns.health-penalty: 4.0
    concussion.duration-seconds: 240
    concussion.break-speed-penalty: 0.30
    concussion.attack-penalty: 1.0
    punctured_lung.duration-seconds: 240
    punctured_lung.oxygen-penalty: 5.0
    punctured_lung.speed-penalty: 0.10
    frostbite.duration-seconds: 240
    frostbite.attack-penalty: 1.5
    frostbite.break-speed-penalty: 0.25
    poisoned_blood.duration-seconds: 300
    poisoned_blood.attack-penalty: 1.5
    poisoned_blood.speed-penalty: 0.10
    shock.duration-seconds: 180
    shock.attack-penalty: 1.0
    shock.speed-penalty: 0.10

    # Mortal wounds. These never fade - only death or treatment removes them.
    # Every damage category has one. A category with no mortal wound behind it means the
    # largest hits of that kind are classified as maiming and then leave no mark at all,
    # which is how piercing ended up with its worst blows being its least consequential.
    lost_arm.attack-penalty: 3.0
    lost_arm.break-speed-penalty: 0.40
    broken_legs.speed-penalty: 0.45
    broken_legs.jump-penalty: 0.50
    charred.health-penalty: 8.0
    impaled.attack-penalty: 2.0
    impaled.speed-penalty: 0.15
    frozen_marrow.speed-penalty: 0.25
    frozen_marrow.attack-penalty: 2.0
    rotting_wound.health-penalty: 4.0
    failing_body.health-penalty: 4.0
    failing_body.attack-penalty: 1.0

    # The Priest - five powers, triggered with /ability 1 through 5.
    # Slot number and tier are the same thing.
    priest.lay-hands-heal: 6.0
    priest.lay-hands-cooldown: 8
    priest.mend-self-heal: 4.0
    priest.mend-self-cooldown: 25
    priest.smite-damage: 9.0
    priest.smite-range: 6.0
    priest.smite-cooldown: 20
    priest.consecrate-range: 10.0
    priest.consecrate-seconds: 12
    priest.consecrate-cooldown: 60
    priest.close-wound-cooldown: 300

    # What the Priest looks like.
    #
    # smite-max-pillars caps how many pillars of light are drawn no matter how many undead
    # were caught. A priest who smites a horde would otherwise draw several thousand
    # particles in one frame and stutter every client watching; the first few carry the idea.
    priest.smite-max-pillars: 8
    #
    # The ambient glow a priest gives off while their staff is in hand - a halo that grows
    # with their tier, so other players can tell a priest who can close a mortal wound from
    # one who cannot just by looking. Set ambient-effects to 0 to turn it off entirely, or
    # raise ambient-interval to make it rarer (it counts half-seconds between motes).
    priest.ambient-effects: 1.0
    priest.ambient-interval: 4

    # What opens each tier. Healing opens 2 and 3, felling undead opens 4 and 5,
    # so nobody reaches the top by only ever doing the half they find easier.
    priest.tier2-healing: 120
    priest.tier3-healing: 300
    priest.tier4-undead: 60
    priest.tier5-undead: 150

abilities:
  # How much progress one shard of Singularity residue buys toward the next tier.
  #
  # This is the rate that decides whether the accelerant is a genuine alternative route
  # or merely a nudge. It exists so an ability gated behind something its owner rarely
  # does cannot leave them staring at a tier they can read about and never reach.
  progress-per-residue: 25

rescue:
  # How long a living player may stay in the grey before it starts keeping things.
  #
  # Long enough to search a featureless world and find the way back; short enough that
  # wandering off is a real mistake. Run out of time and it takes a life for letting you
  # out - and if you had none to spare, it does not let you out at all.
  crossing-seconds: 300

singularity:
  # Rolled for EVERY online player, every interval - not once for the server. A single
  # roll would mean a full server and an empty one saw the same number of creatures,
  # and the people actually playing would almost never meet any.
  chance-per-player: 0.5
  interval-seconds: 1800

  # Chance a dead creature leaves one of the five books.
  book-drop-chance: 0.75

  # How close creatures appear to the player they were sent to. max must be >= min, or
  # every placement attempt fails silently and the Singularity never appears at all.
  min-distance: 24
  max-distance: 48

  # Residue left per kill - the universal accelerant for ability unlocks.
  min-residue: 1
  max-residue: 3

  # How far away a player starts to feel one of these, in blocks.
  #
  # Deliberately larger than min-distance above, so the warning lands before the
  # creature does rather than at the same moment. Set to 0 to remove the warning
  # entirely and let them arrive unannounced.
  sense-range: 40.0

injuries:
  # Severity is judged on damage AFTER armour, as a fraction of the victim's own maximum
  # health. Post-armour is what makes heavy protection genuinely protective against being
  # maimed; proportional to max health is what keeps it fair for a player with extra hearts.
  #
  # mortal-threshold must be at least injury-threshold, or the worst wounds would be
  # reachable by lighter blows than ordinary ones.
  #
  # Wounds are meant to be an ordinary part of surviving rather than a rare event: walk out
  # of a real fight and you should be carrying something. injury-threshold sits at roughly a
  # heart and a quarter AFTER armour, and most blows past it leave a mark.
  #
  # Mortal wounds are the opposite. They are permanent until a life is spent, so they stay
  # pinned to blows that took more than half of everything you had in a single hit. The gap
  # between the two thresholds is the design - hurt often, maimed almost never.
  injury-threshold: 0.15
  injury-chance: 0.55
  mortal-threshold: 0.60
  mortal-chance: 0.30

  # What mends a wound early.
  #
  # instant-health-cures is how many ordinary wounds a potion of Healing closes. Worst first:
  # the wound with the longest left to run, so the potion is spent on the one that was
  # actually bothering them. Healing II mends the same number and just restores more health.
  #
  # regeneration-cure-seconds is how long a player must be under a Regeneration effect per
  # wound mended. A normal Regeneration potion runs 45 seconds, so it works through four.
  # Set to 0 to turn it off.
  #
  # NEITHER touches a mortal wound. Nothing you can drink regrows an arm - that still costs
  # a life, or a Priest at the top of their tier.
  instant-health-cures: 1
  regeneration-cure-seconds: 10.0

boons:
  # A blessing is a straight upside. A curse is a larger upside paid for with a real
  # cost. They are mutually exclusive slices of one roll, so these two must not add up
  # to more than 1.0 - the rest of the population gets neither.
  blessing-chance: 0.15
  curse-chance: 0.15

combat:
  # Damage one player causes another is multiplied by this. 0.5 halves it.
  # Set to 1.0 for vanilla PvP. Must be between 0.0 and 10.0.
  pvp-damage-multiplier: 0.5

  # Natural regeneration from a full hunger bar, and health gained from eating.
  food-healing-multiplier: 0.5

  # The Regeneration effect, from potions, beacons and abilities.
  # Above 1.0 makes it worth more than it is in vanilla.
  regeneration-multiplier: 1.25

  # Whether indirect damage still counts as one player hurting another.
  #
  # These default to true for a reason: halving only melee damage does not reduce
  # fighting, it just changes the weapon. Turn one off and anyone who wants to hurt
  # someone reaches for a bow, a wolf, or a stack of TNT instead.
  include-projectiles: true
  include-pets: true
  include-explosives: true

# Verbose logging at startup. Can be toggled live with /liminalis debug on|off.
# With this on, every damage and healing adjustment is logged, which is the quickest
# way to confirm the numbers above are actually being applied.
debug: false
