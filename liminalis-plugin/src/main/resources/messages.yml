# Every line Liminalis says to a player.
#
# Formatted with MiniMessage: https://docs.advntr.dev/minimessage/format.html
# <prefix> is available in any message and inserts the prefix defined below.
#
# This file is the voice of the server. Operator and diagnostic output from the
# /liminalis admin commands is deliberately NOT here - it lives in code, because it is
# tooling rather than something a player ever reads.
#
# Reload with /liminalis reload messages.

prefix: "<dark_gray>[<gradient:#6f8faf:#c9d6e3>Liminalis</gradient><dark_gray>]</dark_gray> "

# ---------------------------------------------------------------------------------------
# Lives
# ---------------------------------------------------------------------------------------

lives:
  spent: "<prefix><gray>A life is gone. <white><lives></white> remain.</gray>"
  last-one: "<prefix><red>One life left.</red><gray> The next one is the last.</gray>"

# ---------------------------------------------------------------------------------------
# Limbo
# ---------------------------------------------------------------------------------------

limbo:
  fell: "<gray><italic>The grey takes you. There is no pain here, and no way out.</italic></gray>"
  fell-broadcast: "<dark_gray><italic><white><player></white> has spent their last life.</italic></dark_gray>"

  contained: "<gray><italic>There is no way out of Limbo. Not like this.</italic></gray>"
  returned-on-login: "<gray><italic>You are still here. Of course you are.</italic></gray>"
  revived-while-away: "<white>Something reached in and pulled you out.</white>"

  not-dead: "<gray>You are alive. This is not for you.</gray>"

  # <player> and <message> are the speaker and what they said.
  chat: "<dark_gray>[<gray>Limbo</gray>]</dark_gray> <white><player></white><dark_gray>:</dark_gray> <gray><message></gray>"

  # What the living occasionally hear. The message arrives already worn away.
  whisper: "<dark_gray><italic><message></italic></dark_gray>"

# ---------------------------------------------------------------------------------------
# Ghost visits
# ---------------------------------------------------------------------------------------

ghost:
  begin: "<prefix><gray>You drift back among the living for <white><time></white>. They cannot see you.</gray>"
  expired: "<gray><italic>The grey pulls you back.</italic></gray>"
  ended: "<gray><italic>You let go, and return.</italic></gray>"
  cooldown: "<prefix><gray>Not yet. You may walk again in <white><time></white>.</gray>"
  only-the-dead: "<gray>Only the dead can do that.</gray>"
  already-visiting: "<gray>You are already there.</gray>"
  not-visiting: "<gray>You are in Limbo. There is nothing to return from.</gray>"
  nowhere-to-go: "<prefix><red>There is nowhere to return to.</red>"

# ---------------------------------------------------------------------------------------
# Traits
#
# Each trait needs a .name and a .description under trait.<id>. They are shown on first
# join and whenever a player runs /profile. Write them as the world describing someone,
# not as a stat block - the numbers live in config.yml.
# ---------------------------------------------------------------------------------------

traits:
  reveal-header: "<prefix><gray><italic>Something about you was already decided.</italic></gray>"
  reveal-entry: "<white>  <trait></white><newline><dark_gray>    <description></dark_gray>"
  reveal-singularity: "<gradient:#8f7fbf:#c9d6e3>  <trait></gradient> <dark_gray><italic>(this one should not exist)</italic></dark_gray><newline><dark_gray>    <description></dark_gray>"
  reveal-none: "<gray>  Nothing. You are entirely ordinary.</gray>"

trait:
  short:
    name: "Short"
    description: "You are smaller than everyone else, and your reach is shorter for it."
  swift_hands:
    name: "Swift Hands"
    description: "Stone gives way under your tools faster than it should."
  ironbound:
    name: "Ironbound"
    description: "Something in you is harder than flesh. Blows land softer."
  deep_lungs:
    name: "Deep Lungs"
    description: "You can stay under far longer than is reasonable."
  resilience:
    name: "Resilience"
    description: "The closer you are to death, the harder you are to finish."
  coward:
    name: "Coward"
    description: "Untouched, you hit like a beast. Bloodied, you falter."
  deathsight:
    name: "Deathsight"
    description: "You can see the dead when they walk among the living. No one else can."
  stillness:
    name: "Stillness"
    description: "Your wounds close only while you do not move at all."

mark:
  mark_of_return:
    name: "Mark of Return"
    description: "You have been to the other side. You can feel it when something from there is close."

# ---------------------------------------------------------------------------------------
# Blessings and curses
#
# A curse needs a .refused line if it forbids wearing something - that is what a player
# sees when the game takes the piece back off them.
# ---------------------------------------------------------------------------------------

boons:
  reveal-blessing: "<green>  Blessed: <name></green><newline><dark_gray>    <description></dark_gray>"
  reveal-curse: "<dark_red>  Cursed: <name></dark_red><newline><dark_gray>    <description></dark_gray>"

blessing:
  ironblood:
    name: "Ironblood"
    description: "There is more of you to lose. Three hearts more."
  far_wanderer:
    name: "Far Wanderer"
    description: "Distance means less to you than it does to other people."
  steady_hand:
    name: "Steady Hand"
    description: "You have never missed anything you meant to hit."
  thickskinned:
    name: "Thick-Skinned"
    description: "What armour you wear works harder than it should."
  long_arms:
    name: "Long Arms"
    description: "You reach things other people have to step towards."

curse:
  hollow:
    name: "Hollow"
    description: "Three hearts more than anyone, and heavy protection will not stay on you."
    refused: "<prefix><dark_red>The weight of it will not sit on you. Something in you refuses.</dark_red>"
  unshod:
    name: "Unshod"
    description: "You move like something hunted. You will never wear boots again."
    refused: "<prefix><dark_red>They will not stay on your feet.</dark_red>"
  brittle:
    name: "Brittle"
    description: "You hit far harder than you should, and you break far more easily."
  swiftbane:
    name: "Swiftbane"
    description: "Almost nothing can hurt you. You will never outrun anything again."
  shallow_lungs:
    name: "Shallow Lungs"
    description: "Strength enough for anything but water. Do not go under."

# ---------------------------------------------------------------------------------------
# Later phases add their own sections: injuries, the Singularity, revival, abilities.
# ---------------------------------------------------------------------------------------

profile:
  header: "<prefix><gray>You are</gray> <white><name></white>"
  lives: "<gray>  Lives remaining: </gray><white><lives></white>"
  traits: "<gray>  Traits: </gray><white><traits></white>"
  none: "<dark_gray>none</dark_gray>"
