# Every line Liminalis says to a player.
#
# Formatted with MiniMessage: https://docs.advntr.dev/minimessage/format.html
# <prefix> is available in any message and inserts the prefix defined below.
#
# This file is the voice of the server. Operator and diagnostic output from the
# /liminalis admin commands is deliberately NOT here - it lives in code, because it is
# tooling rather than something a player ever reads.
#
# Reload with /liminalis reload messages.

prefix: "<dark_gray>[<gradient:#6f8faf:#c9d6e3>Liminalis</gradient><dark_gray>]</dark_gray> "

# ---------------------------------------------------------------------------------------
# Lives
# ---------------------------------------------------------------------------------------

lives:
  spent: "<prefix><gray>A life is gone. <white><lives></white> remain.</gray>"
  last-one: "<prefix><red>One life left.</red><gray> The next one is the last.</gray>"

# ---------------------------------------------------------------------------------------
# Limbo
# ---------------------------------------------------------------------------------------

limbo:
  fell: "<gray><italic>The grey takes you. There is no pain here, and no way out.</italic></gray>"
  fell-broadcast: "<dark_gray><italic><white><player></white> has spent their last life.</italic></dark_gray>"

  contained: "<gray><italic>There is no way out of Limbo. Not like this.</italic></gray>"
  returned-on-login: "<gray><italic>You are still here. Of course you are.</italic></gray>"
  revived-while-away: "<white>Something reached in and pulled you out.</white>"

  not-dead: "<gray>You are alive. This is not for you.</gray>"

  # <player> and <message> are the speaker and what they said.
  chat: "<dark_gray>[<gray>Limbo</gray>]</dark_gray> <white><player></white><dark_gray>:</dark_gray> <gray><message></gray>"

  # What the living occasionally hear. The message arrives already worn away.
  whisper: "<dark_gray><italic><message></italic></dark_gray>"

# ---------------------------------------------------------------------------------------
# Ghost visits
# ---------------------------------------------------------------------------------------

ghost:
  begin: "<prefix><gray>You drift back among the living for <white><time></white>. They cannot see you.</gray>"
  expired: "<gray><italic>The grey pulls you back.</italic></gray>"
  ended: "<gray><italic>You let go, and return.</italic></gray>"
  cooldown: "<prefix><gray>Not yet. You may walk again in <white><time></white>.</gray>"
  only-the-dead: "<gray>Only the dead can do that.</gray>"
  already-visiting: "<gray>You are already there.</gray>"
  not-visiting: "<gray>You are in Limbo. There is nothing to return from.</gray>"
  nowhere-to-go: "<prefix><red>There is nowhere to return to.</red>"

# ---------------------------------------------------------------------------------------
# Traits
#
# Each trait needs a .name and a .description under trait.<id>. They are shown on first
# join and whenever a player runs /profile. Write them as the world describing someone,
# not as a stat block - the numbers live in config.yml.
# ---------------------------------------------------------------------------------------

traits:
  reveal-header: "<prefix><gray><italic>Something about you was already decided.</italic></gray>"
  reveal-entry: "<white>  <trait></white><newline><dark_gray>    <description></dark_gray>"
  reveal-singularity: "<gradient:#8f7fbf:#c9d6e3>  <trait></gradient> <dark_gray><italic>(this one should not exist)</italic></dark_gray><newline><dark_gray>    <description></dark_gray>"
  reveal-none: "<gray>  Nothing. You are entirely ordinary.</gray>"

trait:
  short:
    name: "Short"
    description: "You are smaller than everyone else, and your reach is shorter for it."
  swift_hands:
    name: "Swift Hands"
    description: "Stone gives way under your tools faster than it should."
  ironbound:
    name: "Ironbound"
    description: "Something in you is harder than flesh. Blows land softer."
  deep_lungs:
    name: "Deep Lungs"
    description: "You can stay under far longer than is reasonable."
  resilience:
    name: "Resilience"
    description: "The closer you are to death, the harder you are to finish."
  coward:
    name: "Coward"
    description: "Untouched, you hit like a beast. Bloodied, you falter."
  deathsight:
    name: "Deathsight"
    description: "You can see the dead when they walk among the living. No one else can."
  stillness:
    name: "Stillness"
    description: "Your wounds close only while you do not move at all."
  tall:
    name: "Tall"
    description: "You see over things other people have to walk around."
  fleet:
    name: "Fleet"
    description: "You have always been the one who gets there first."
  sure_footed:
    name: "Sure-Footed"
    description: "Drops that would break someone else barely register."
  heavy:
    name: "Heavy"
    description: "Things hit you and you do not go anywhere."
  warm_blooded:
    name: "Warm-Blooded"
    description: "Fire finds less of you to hold on to."
  waterborne:
    name: "Waterborne"
    description: "You move through water like something that belongs in it."
  dawnbound:
    name: "Dawnbound"
    description: "You are at your best in full sun, and ordinary once it sets."
  duskbound:
    name: "Duskbound"
    description: "The light going is the moment you start to matter."
  liminal:
    name: "Liminal"
    description: "You can see what came through the door, long before it reaches you."
  unseen:
    name: "Unseen"
    description: "Stand perfectly still and things stop finding you worth looking at."

mark:
  mark_of_return:
    name: "Mark of Return"
    description: "You have been to the other side. You can feel it when something from there is close."

# ---------------------------------------------------------------------------------------
# Blessings and curses
#
# A curse needs a .refused line if it forbids wearing something - that is what a player
# sees when the game takes the piece back off them.
# ---------------------------------------------------------------------------------------

boons:
  reveal-blessing: "<green>  Blessed: <name></green><newline><dark_gray>    <description></dark_gray>"
  reveal-curse: "<dark_red>  Cursed: <name></dark_red><newline><dark_gray>    <description></dark_gray>"

blessing:
  ironblood:
    name: "Ironblood"
    description: "There is more of you to lose. Three hearts more."
  far_wanderer:
    name: "Far Wanderer"
    description: "Distance means less to you than it does to other people."
  steady_hand:
    name: "Steady Hand"
    description: "You have never missed anything you meant to hit."
  thickskinned:
    name: "Thick-Skinned"
    description: "What armour you wear works harder than it should."
  long_arms:
    name: "Long Arms"
    description: "You reach things other people have to step towards."

curse:
  hollow:
    name: "Hollow"
    description: "Three hearts more than anyone, and heavy protection will not stay on you."
    refused: "<prefix><dark_red>The weight of it will not sit on you. Something in you refuses.</dark_red>"
  unshod:
    name: "Unshod"
    description: "You move like something hunted. You will never wear boots again."
    refused: "<prefix><dark_red>They will not stay on your feet.</dark_red>"
  brittle:
    name: "Brittle"
    description: "You hit far harder than you should, and you break far more easily."
  swiftbane:
    name: "Swiftbane"
    description: "Almost nothing can hurt you. You will never outrun anything again."
  shallow_lungs:
    name: "Shallow Lungs"
    description: "Strength enough for anything but water. Do not go under."

# ---------------------------------------------------------------------------------------
# Injuries
# ---------------------------------------------------------------------------------------

injuries:
  taken: "<prefix><red><injury></red><newline><dark_gray>  <description></dark_gray>"
  mortal: "<prefix><dark_red><bold><injury></bold></dark_red><newline><dark_gray>  <description></dark_gray>"
  healed: "<prefix><gray>Your <white><injury></white> has healed.</gray>"
  cleared-by-death: "<gray><italic>A new body. Whatever was wrong with the old one is not your problem now.</italic></gray>"

injury:
  bleeding:
    name: "Bleeding"
    description: "You are losing blood. It will stop, but not soon."
  sprained_ankle:
    name: "Sprained Ankle"
    description: "Every step is a decision. You are not outrunning anything."
  burns:
    name: "Burns"
    description: "There is less of you that still works. Do not take another hit."
  concussion:
    name: "Concussion"
    description: "Your hands will not do what you tell them, and neither will your aim."
  punctured_lung:
    name: "Punctured Lung"
    description: "Breathing is work now. Stay out of the water."
  lost_arm:
    name: "Lost Arm"
    description: "It is gone. You will not get it back in this body."
  broken_legs:
    name: "Broken Legs"
    description: "They are not going to set themselves. You crawl now."
  charred:
    name: "Charred"
    description: "Most of you burned. What is left is not enough to take much more."

# ---------------------------------------------------------------------------------------
# The Singularity
# ---------------------------------------------------------------------------------------

singularity:
  slain: "<prefix><gray>The <white><creature></white> stops.</gray>"

  hollow_one:
    name: "<gray>Hollow One</gray>"
  watcher:
    name: "<gray>Watcher</gray>"
  remnant:
    name: "<gray>Remnant</gray>"
  the_tall:
    name: "<gray>The Tall</gray>"
  carrion:
    name: "<gray>Carrion</gray>"
  mote:
    name: "<gray>Mote</gray>"
  crawler:
    name: "<gray>Crawler</gray>"
  herald:
    name: "<dark_gray>Herald</dark_gray>"

  residue:
    name: "<dark_aqua>Residue</dark_aqua>"
    lore: "<dark_gray>What is left when one of them stops.</dark_gray>"

# ---------------------------------------------------------------------------------------
# Rescue - crossing into the grey to fetch someone back
# ---------------------------------------------------------------------------------------

rescue:
  stone:
    name: "<gradient:#8f7fbf:#c9d6e3>Threshold Stone</gradient>"
    lore-1: "<dark_gray>A way in. Not a way back.</dark_gray>"
    lore-2: "<dark_gray>Single use.</dark_gray>"

  crossed: "<gray><italic>The world thins, and lets you through.</italic></gray>"
  warning: "<prefix><red>Be at the light when your time runs out.</red><gray> If you are not, the grey will take a life for letting you go - and if you have none, it will keep you.</gray>"

  already-crossed: "<gray>You are already there.</gray>"
  already-lost: "<gray>You cannot fetch anyone. You are what needs fetching.</gray>"
  no-way-through: "<prefix><red>Nothing happens. The way is not open.</red>"

  took-hold: "<prefix><white>You have hold of <player>.</white><gray> They are coming out with you.</gray>"
  taken-hold: "<prefix><white><player> has hold of you.</white><gray> Do not let go.</gray>"
  already-holding: "<gray>You already have hold of <player>.</gray>"

  returned: "<gray><italic>You step back through, and the weight of the world returns.</italic></gray>"
  returned-diminished: "<prefix><red>You were too slow.</red><gray> The grey let you go, and kept a life for the trouble.</gray>"
  stranded: "<dark_red><italic>Your time ran out, and you had nothing left to give it.</italic></dark_red>"
  stranded-broadcast: "<dark_gray><italic><white><player></white> went in after someone and did not come back.</italic></dark_gray>"

  brought-back: "<white><player> carried you out of the grey.</white>"
  brought-back-broadcast: "<dark_gray><italic><white><player></white> has been brought back by <white><rescuer></white>.</italic></dark_gray>"

# ---------------------------------------------------------------------------------------
# Abilities
#
# Each one needs ability.<id>.name and .description, plus a .tier<n> line per tier saying
# what that tier granted. Written for the player who asked for it - they will read this
# line the moment they earn it, and it is the payoff for however long they worked.
# ---------------------------------------------------------------------------------------

ability:
  granted: "<prefix><gradient:#c9d6e3:#8f7fbf><ability></gradient><newline><dark_gray>  <description></dark_gray>"
  tier-gained: "<prefix><gradient:#c9d6e3:#8f7fbf>Something opens up.</gradient><newline><white>  Tier <tier>: <granted></white>"
  fed: "<gray>The residue goes into it and does not come back. <white>+<amount></white></gray>"
  none-to-feed: "<gray>You have no ability for it to go into.</gray>"
  already-complete: "<gray>There is nothing left of it to open.</gray>"

  priest:
    name: "Priest"
    description: "You can put your hands on someone and make them better. Right-click, empty-handed."
    tier1: "Lay hands on someone to heal them."
    tier2: "Your blows carry holy weight against the undead."
    tier3: "Sneak and right-click to close a mortal wound. Nothing else in the world can."
    healed: "<gray>You lay hands on <white><player></white>.</gray>"
    healed-by: "<gray><white><player></white> lays hands on you. It helps.</gray>"
    already-whole: "<gray><player> is not hurt.</gray>"
    not-yet: "<gray>Not yet. <white><seconds>s</white>.</gray>"
    nothing-to-treat: "<gray><player> has no mortal wound. Only those.</gray>"
    treated: "<prefix><white>You close the wound. It should not have been possible.</white>"
    treated-by: "<prefix><white><player> closes your wound.</white><gray> Whatever was taken is back.</gray>"

# ---------------------------------------------------------------------------------------
# Later phases add their own sections: the boss.
# ---------------------------------------------------------------------------------------

profile:
  header: "<prefix><gray>You are</gray> <white><name></white>"
  lives: "<gray>  Lives remaining: </gray><white><lives></white>"
  traits: "<gray>  Traits: </gray><white><traits></white>"
  none: "<dark_gray>none</dark_gray>"
