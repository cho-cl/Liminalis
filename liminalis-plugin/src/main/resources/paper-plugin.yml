name: Liminalis
version: '${project.version}'
main: com.liminalis.plugin.LiminalisPlugin
api-version: '1.21'
description: Three lives, one ability, and the fog between.
authors:
  - AERO
website: https://github.com/

permissions:
  liminalis.admin:
    description: Access to the /liminalis administration tree.
    default: op
    children:
      liminalis.admin.debug: true
      liminalis.admin.data: true
      liminalis.admin.lives: true
      liminalis.admin.limbo: true
      liminalis.admin.trait: true
      liminalis.admin.blessing: true
      liminalis.admin.curse: true
      liminalis.admin.mark: true
      liminalis.admin.injury: true
      liminalis.admin.ability: true
  liminalis.admin.debug:
    description: Toggle verbose logging.
    default: op
  liminalis.admin.data:
    description: Save, inspect, back up and re-read profile files.
    default: op
  liminalis.admin.lives:
    description: View and change how many lives a player has, and the PvP-deaths toggle.
    default: op
  liminalis.admin.limbo:
    description: Send players to Limbo, revive them, and inspect who is trapped there.
    default: op
  liminalis.admin.trait:
    description: List, inspect, grant, remove and reroll player traits.
    default: op
  liminalis.admin.blessing:
    description: Hand out and take back blessings.
    default: op
  liminalis.admin.curse:
    description: Hand out and take back curses.
    default: op
  liminalis.admin.mark:
    description: Hand out and take back marks.
    default: op
  liminalis.admin.injury:
    description: List, inspect, inflict and heal injuries and mortal wounds.
    default: op
  liminalis.admin.ability:
    description: Grant, take, inspect and tier player abilities. Works on offline players.
    default: op
